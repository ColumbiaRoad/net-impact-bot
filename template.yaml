AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Net Impact Bot API deployed via AWS Lambda + API Gateway (esbuild)

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs20.x
    MemorySize: 512

Resources:
  NetImpactBotApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: net-impact-bot
      CodeUri: .
      Handler: src/lambda.handler
      Environment:
        Variables:
          HUBSPOT_ACCESS_TOKEN: ""
          HUBSPOT_PORTAL_ID: ""
          UPRIGHT_API_TOKEN: ""
          UPRIGHT_USER_EMAIL: ""
          UPRIGHT_USER_PASSWORD: ""
          SLACK_TOKEN: ""
          SLACK_PROFILE_CHANNEL: ""
          SLACK_ADMIN_CHANNEL: ""
          SLACK_HASH: ""
          HUBSPOT_HASH: ""
          DEALS_HASH: ""
          PORT: ""
          USE_AWS_LAMBDA: ""
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Minify: false
        Sourcemap: true
        Target: es2022
        Format: cjs

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${NetImpactBotApiFunction.Api}.execute-api.${AWS::Region}.amazonaws.com/"
