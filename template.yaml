AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Net Impact Bot API deployed via AWS Lambda + API Gateway (esbuild)

Parameters:
  HubspotAccessToken:
    Type: String
    Description: "HubSpot access token"
  HubspotPortalId:
    Type: String
    Description: "HubSpot portal ID"
  UprightApiToken:
    Type: String
    Description: "Upright API token"
  UprightUserEmail:
    Type: String
    Description: "Upright user email"
  UprightUserPassword:
    Type: String
    Description: "Upright user password"
  SlackToken:
    Type: String
    Description: "Slack bot token"
  SlackProfileChannel:
    Type: String
    Description: "Slack channel ID for profile notifications"
  SlackAdminChannel:
    Type: String
    Description: "Slack channel ID for administrative notifications"
  SlackHash:
    Type: String
    Description: "Slack signing secret hash"
  HubspotHash:
    Type: String
    Description: "HubSpot signing secret hash"
  DealsHash:
    Type: String
    Description: "Deals signing hash"
  Port:
    Type: String
    Description: "Port for local development"
  UseAwsLambda:
    Type: String
    Description: "Flag to indicate use of AWS Lambda (true/false)"

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs20.x
    MemorySize: 512

Resources:
  NetImpactBotApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: net-impact-bot
      CodeUri: .
      Handler: src/lambda.handler
      Environment:
        Variables:
          HUBSPOT_ACCESS_TOKEN: !Ref HubspotAccessToken
          HUBSPOT_PORTAL_ID: !Ref HubspotPortalId
          UPRIGHT_API_TOKEN: !Ref UprightApiToken
          UPRIGHT_USER_EMAIL: !Ref UprightUserEmail
          UPRIGHT_USER_PASSWORD: !Ref UprightUserPassword
          SLACK_TOKEN: !Ref SlackToken
          SLACK_PROFILE_CHANNEL: !Ref SlackProfileChannel
          SLACK_ADMIN_CHANNEL: !Ref SlackAdminChannel
          SLACK_HASH: !Ref SlackHash
          HUBSPOT_HASH: !Ref HubspotHash
          DEALS_HASH: !Ref DealsHash
          PORT: !Ref Port
          USE_AWS_LAMBDA: !Ref UseAwsLambda
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Minify: false
        Sourcemap: true
        Target: es2022
        Format: cjs

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${NetImpactBotApiFunction.Api}.execute-api.${AWS::Region}.amazonaws.com/"
